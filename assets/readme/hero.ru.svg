<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">AI Music Lab</title>
  <desc id="heroDesc">Локальная лаборатория анализа аудио: два открытых AI-детектора запускаются на своей машине, а панель «время × частота» показывает, в каком окне трека отпечаток сильнее всего.</desc>

  <rect width="1200" height="360" rx="24" fill="#06101a"/>

  <g id="title-block">
    <rect x="64" y="56" width="64" height="3" fill="#23b7e5"/>
    <text x="64" y="96" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="18" letter-spacing="3" fill="#23b7e5">LOCAL FORENSIC AUDIO WORKSPACE</text>
    <text x="64" y="176" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="72" font-weight="700" fill="#edf5fa">AI Music Lab</text>
    <text x="64" y="222" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="23" fill="#91a3b3">Два открытых AI-детектора локально —</text>
    <text x="64" y="254" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
          font-size="23" fill="#91a3b3">и карта того, где сидит отпечаток.</text>
    <text x="64" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
          font-size="18" letter-spacing="2" fill="#5f7488">WINDOWS · NVIDIA CUDA · PYTHON 3.11 · MIT</text>
  </g>

